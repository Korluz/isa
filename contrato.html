   <div class="header-text">
    <h1>Indômito Contract Manager</h1>
    
   </div>
  </div>
  <form id="form" onsubmit="return false;">
   <div class="section-title">Dados do contratante</div>
   <div class="grid">
    <div class="field"><label>Nome completo</label><input id="nome" required ></div>
    <div class="field"><label>Nacionalidade</label><input id="nacionalidade" ></div>
    <div class="field"><label>Estado civil</label><input id="estadoCivil" ></div>
    <div class="field"><label>Data de nascimento</label><input id="nascimento" placeholder="dd/mm/aaaa" ></div>
    <div class="field"><label>CPF</label><input id="cpf" placeholder="000.000.000-00" ></div>
    <div class="field"><label>Telefone/WhatsApp</label><input id="telefone" placeholder="(00) 00000-0000" ></div>
    <div class="field full"><label>E-mail</label><input id="email" type="email" ></div>
    <div class="field full"><label>Endereço completo</label><input id="endereco" placeholder="Rua, número, bairro, cidade/UF" ></div>
    <div class="field"><label>CEP</label><input id="cep" placeholder="00000-000" ></div>
   </div>
   <div class="section-title">Financeiro</div>
   <div class="grid">
    <div class="field"><label>Valor total</label><input id="valor" placeholder="R$ 0.000,00" ></div>
    <div class="field full"><label>Forma de pagamento / observação</label><textarea id="pagamento" placeholder="Ex.: Pagamento via PIX à vista em 06/07/2026"></textarea></div>
   </div>
   <div class="section-title">Anexos</div>
   <div class="grid">
    <div class="field">
      <label>Comprovante de pagamento</label>
      <input id="comprovante" type="file" multiple accept="application/pdf,image/png,image/jpeg,image/webp">
      <div id="comprovanteLista" class="file-list"><div class="file-empty">Nenhum comprovante adicionado.</div></div>
    </div>
    <div class="field">
      <label>Voucher</label>
      <input id="voucher" type="file" multiple accept="application/pdf,image/png,image/jpeg,image/webp">
      <div id="voucherLista" class="file-list"><div class="file-empty">Nenhum voucher adicionado.</div></div>
    </div>
   </div>
   <div class="actions">
    <button type="button" class="primary" id="gerar" onclick="gerarPDFSeguro()">Gerar contrato PDF</button>
    <button type="button" class="secondary" id="limpar">Limpar formulário</button>
    <span class="status" id="status"></span>
   </div>
  </form>
 </div>
</div>

const $ = id => document.getElementById(id);

const anexosSelecionados = {
  comprovante: [],
  voucher: []
};

function fileKey(file){
  return `${file.name}|${file.size}|${file.lastModified}`;
}

function atualizarListaAnexos(tipo){
  const lista = $(`${tipo}Lista`);
  if(!lista) return;
  const arquivos = anexosSelecionados[tipo];
  lista.innerHTML = '';

  if(!arquivos.length){
    const vazio = document.createElement('div');
    vazio.className = 'file-empty';
    vazio.textContent = tipo === 'voucher'
      ? 'Nenhum voucher adicionado.'
      : 'Nenhum comprovante adicionado.';
    lista.appendChild(vazio);
    return;
  }

  arquivos.forEach((arquivo, indice)=>{
    const item = document.createElement('div');
    item.className = 'file-item';

    const nome = document.createElement('span');
    nome.className = 'file-item-name';
    nome.textContent = `${indice + 1}. ${arquivo.name}`;
    nome.title = arquivo.name;

    const remover = document.createElement('button');
    remover.type = 'button';
    remover.className = 'file-remove';
    remover.textContent = 'Remover';
    remover.addEventListener('click', ()=>{
      anexosSelecionados[tipo].splice(indice, 1);
      atualizarListaAnexos(tipo);
    });

    item.append(nome, remover);
    lista.appendChild(item);
  });
}

function configurarAnexoAcumulativo(tipo){
  const input = $(tipo);
  if(!input) return;

  input.addEventListener('change', ()=>{
    const existentes = new Set(anexosSelecionados[tipo].map(fileKey));

    for(const arquivo of Array.from(input.files || [])){
      const chave = fileKey(arquivo);
      if(!existentes.has(chave)){
        anexosSelecionados[tipo].push(arquivo);
        existentes.add(chave);
      }
    }

    // Permite abrir o seletor novamente sem apagar os arquivos anteriores.
    input.value = '';
    atualizarListaAnexos(tipo);
  });
}

function addWrapped(pdf, text, x, y, maxW=CONTENT_W, opts={}) {
  const size = opts.size || 11.8;

async function fileToDataURL(file) {
  if(!file) return '';
  if(!file.type.startsWith('image/')) {
    return await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
  }

  // Reduz fotos grandes antes de mantê-las na memória.
  const bitmap = await createImageBitmap(file);
  const maxSide = 1800;
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const width = Math.max(1, Math.round(bitmap.width * scale));
  const height = Math.max(1, Math.round(bitmap.height * scale));

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d', {alpha:false});
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,width,height);
  ctx.drawImage(bitmap,0,0,width,height);
  bitmap.close();

  const data = canvas.toDataURL('image/jpeg', 0.78);
  canvas.width = 1;
  canvas.height = 1;
  return data;
}
function cropWhiteCanvas(canvas, padding=28) {
  const ctx = canvas.getContext('2d');
  const {width:w,height:h}=canvas;
  const img = ctx.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=0,maxY=0,found=false;
  for(let y=0;y<h;y+=3){
    for(let x=0;x<w;x+=3){
      const i=(y*w+x)*4, r=img[i], g=img[i+1], b=img[i+2], a=img[i+3];
      if(a>20 && !(r>245 && g>245 && b>245)) { found=true; if(x<minX)minX=x; if(y<minY)minY=y; if(x>maxX)maxX=x; if(y>maxY)maxY=y; }
    }
  }
  if(!found) return canvas;
  minX=Math.max(0,minX-padding); minY=Math.max(0,minY-padding);
  maxX=Math.min(w,maxX+padding); maxY=Math.min(h,maxY+padding);
  const cw=maxX-minX, ch=maxY-minY;
  const out=document.createElement('canvas'); out.width=cw; out.height=ch;
  out.getContext('2d').drawImage(canvas,minX,minY,cw,ch,0,0,cw,ch);
  return out;
}
async function renderFiles(fileList, maxPages=99, crop=false) {
  const allImages = [];
  for (const file of Array.from(fileList || [])) {
    const images = await renderPdfFile(file, maxPages, crop);
    allImages.push(...images);
  }
  return allImages;
}
async function renderPdfFile(file, maxPages=99, crop=false) {
  if(!file) return [];
  if(file.type.startsWith('image/')) return [await fileToDataURL(file)];
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const imgs=[];
  for(let i=1;i<=Math.min(pdf.numPages,maxPages);i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale: 1.65});
    const canvas = document.createElement('canvas'); canvas.width=viewport.width; canvas.height=viewport.height;
    const ctx = canvas.getContext('2d'); await page.render({canvasContext:ctx, viewport}).promise;
    const finalCanvas = crop ? cropWhiteCanvas(canvas, 34) : canvas;
    imgs.push(finalCanvas.toDataURL('image/jpeg',0.82));
    canvas.width = 1; canvas.height = 1;
    if(finalCanvas !== canvas){ finalCanvas.width = 1; finalCanvas.height = 1; }
  }
  return imgs;
}
function fitImage(pdf, dataUrl, x, y, maxW, maxH) {
  const props = pdf.getImageProperties(dataUrl);
  let w = maxW, h = w * props.height / props.width;
  if(h > maxH) { h = maxH; w = h * props.width / props.height; }
  pdf.addImage(dataUrl, dataUrl.includes('image/png')?'PNG':'JPEG', x, y, w, h);
  return {w,h};
}

  }
}

async function gerarPDFSeguro(){
  try {
    if(!window.jspdf || !window.jspdf.jsPDF){
      setStatus('Erro: biblioteca jsPDF não carregou. Verifique a internet ou use Chrome/Edge.');
      alert('A biblioteca jsPDF não carregou. Esta versão usa bibliotecas online. Verifique a internet e abra no Chrome/Edge.');
      return;
    }
    if(!window.pdfjsLib){
      setStatus('Erro: biblioteca PDF.js não carregou. Verifique a internet ou use Chrome/Edge.');
      alert('A biblioteca PDF.js não carregou. Esta versão usa bibliotecas online. Verifique a internet e abra no Chrome/Edge.');
      return;
    }
    if(window.pdfjsLib && pdfjsLib.GlobalWorkerOptions){
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    await gerarPDF();
  } catch (err) {
    console.error(err);
    setStatus('Erro ao gerar: ' + (err && err.message ? err.message : err));
    alert('Erro ao gerar PDF: ' + (err && err.message ? err.message : err));
  }
}

function onlyDigits(v){ return String(v||'').replace(/\D/g,''); }
function maskCPF(v){
  const d=onlyDigits(v).slice(0,11);
  return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
}
function maskCEP(v){
  const d=onlyDigits(v).slice(0,8);
  return d.replace(/(\d{5})(\d{1,3})$/,'$1-$2');
}
function maskDate(v){
  const d=onlyDigits(v).slice(0,8);
  return d.replace(/(\d{2})(\d)/,'$1/$2').replace(/(\d{2})(\d)/,'$1/$2');
}
function maskPhone(v){
  const d=onlyDigits(v).slice(0,11);
  if(d.length<=10){
    return d.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d{1,4})$/,'$1-$2');
  }
  return d.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d{1,4})$/,'$1-$2');
}
function parseMoneyBR(v){
  let s=String(v||'').replace(/R\$/gi,'').trim().replace(/\s/g,'').replace(/[^\d.,-]/g,'');
  if(!s) return null;
  let negative=s.includes('-'); s=s.replace(/-/g,'');
  let n;
  if(s.includes(',')){
    n=Number(s.replace(/\./g,'').replace(',','.'));
  } else if(s.includes('.')){
    const parts=s.split('.');
    const last=parts[parts.length-1];
    if(parts.length>1 && last.length===3) n=Number(parts.join(''));
    else n=Number(s);
  } else {
    n=Number(s);
  }
  if(!Number.isFinite(n)) return null;
  return negative ? -n : n;
}
function formatMoneyBR(v){
  const n=parseMoneyBR(v);
  if(n===null) return '';
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function applyMasks(){
  const bindInput=(id,fn)=>{ const el=$(id); if(el) el.addEventListener('input',()=>{ el.value=fn(el.value); }); };
  bindInput('cpf',maskCPF);
  bindInput('telefone',maskPhone);
  bindInput('cep',maskCEP);
  bindInput('nascimento',maskDate);
  const valor=$('valor'); if(valor){ valor.addEventListener('blur',()=>{ valor.value=formatMoneyBR(valor.value); }); }
}
