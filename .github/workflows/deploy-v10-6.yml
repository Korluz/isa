name: Deploy ISA V10.6.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v10-6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live V10.6.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Cloud V10.6.0','Cloud V10.6.1').replace('v10.6.0','v10.6.1')
          tag='<script src="isa-v1061.js?v=1061"></script>'
          if tag not in s: s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')

          p=Path('contrato.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Indômito Contract Manager — V10.6.0','Indômito Contract Manager — V10.6.1')
          s=s.replace("contractVersion:'10.6.0'","contractVersion:'10.6.1'")
          tag='<script src="contrato-v1061.js?v=1061"></script>'
          if tag not in s: s=s.replace('</head>',tag+'\n</head>')
          p.write_text(s,encoding='utf-8')

          p=Path('assinatura.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("p.contractVersion||'10.6.0'","p.contractVersion||'10.6.1'")
          tag='<script src="assinatura-v1061.js?v=1061"></script>'
          if tag not in s: s=s.replace('</head>',tag+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate V10.6.1 JavaScript
        shell: bash
        run: |
          set -e
          node --check isa-v1061.js
          node --check contrato-v1061.js
          node --check assinatura-v1061.js
          grep -q 'isa-v1061.js?v=1061' index.html
          grep -q 'contrato-v1061.js?v=1061' contrato.html
          grep -q 'assinatura-v1061.js?v=1061' assinatura.html
          grep -q 'Cloud V10.6.1' index.html
          grep -q 'Contract Manager — V10.6.1' contrato.html

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html contrato.html assinatura.html
          if git diff --cached --quiet; then
            echo 'V10.6.1 already deployed.'
            exit 0
          fi
          git commit -m 'ISA V10.6.1 — CPF automático e máscaras'
          git push
