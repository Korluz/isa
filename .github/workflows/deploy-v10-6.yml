name: Deploy ISA V10.7.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v10-6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live V10.7.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Cloud V10.7.0','Cloud V10.7.1').replace('v10.7.0','v10.7.1')

          helper=Path('_patches/voucher-v1071.js').read_text(encoding='utf-8').strip()
          marker=' function parseVoucher(raw){'
          if 'function parseVoucherNovo(raw)' not in s:
              pos=s.find(marker)
              if pos < 0:
                  raise SystemExit('Parser legado não encontrado')
              s=s[:pos]+' '+helper+'\n'+s[pos:]

          old=' function parseVoucher(raw){const lines='
          new=" function parseVoucher(raw){if(/COMPRADOR\\s*:/i.test(raw)&&/LISTA\\s+DE\\s+SERVI[CÇ]OS/i.test(raw))return parseVoucherNovo(raw);const lines="
          if old in s:
              s=s.replace(old,new,1)
          elif 'return parseVoucherNovo(raw);const lines=' not in s:
              raise SystemExit('Detecção do voucher novo não foi aplicada')

          oldfin="valueCents:0,paidCents:0,paymentMethod:'',paymentDate:''"
          newfin="valueCents:Number(v.valueCents||0),paidCents:Number(v.paidCents||0),paymentMethod:v.paymentMethod||'',paymentDate:v.paymentDate||''"
          if oldfin in s:
              s=s.replace(oldfin,newfin,1)
          elif newfin not in s:
              raise SystemExit('Bloco financeiro do importador não encontrado')

          p.write_text(s,encoding='utf-8')

          vp=Path('VERSION.json')
          data=json.loads(vp.read_text(encoding='utf-8'))
          data.update({
            'version':'10.7.1',
            'release':'Compatibilidade com novo modelo de voucher',
            'basedOn':'10.7.0',
            'databaseMigrationRequired':False,
            'features':[
              'Leitura automática do novo voucher de Reserva/Serviços',
              'Compatibilidade preservada com o voucher antigo',
              'Importação de comprador, telefone, vendedor e passageiros/documentos',
              'Importação de serviços, datas, valores e local de embarque',
              'Importação de total pago e forma/data de pagamento quando disponíveis'
            ]
          })
          data.pop('databaseMigration',None)
          vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate V10.7.1 browser JavaScript
        shell: bash
        run: |
          set -e
          node --check auth-v1062.js
          node --check isa-v1061.js
          node --check admin-v1070.js
          node --check update-v1070.js
          node --check contrato-v1061.js
          node --check assinatura-v1061.js
          node --check _patches/voucher-v1071.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',html,re.I|re.S)
          if not blocks:
              raise SystemExit('Nenhum script inline encontrado')
          for i,code in enumerate(blocks):
              f=Path(f'/tmp/isa-inline-{i}.js')
              f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(f'Falha no script inline #{i}:')
                  print(r.stderr)
                  raise SystemExit(1)
          print(f'{len(blocks)} scripts inline validados.')
          PY
          grep -q 'Cloud V10.7.1' index.html
          grep -q 'function parseVoucherNovo' index.html
          grep -q 'return parseVoucherNovo(raw)' index.html
          grep -q 'client=pick(/Cliente' index.html
          grep -q 'valueCents:Number(v.valueCents' index.html
          grep -q '"version": "10.7.1"' VERSION.json

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html VERSION.json
          if git diff --cached --quiet; then
            echo 'V10.7.1 already deployed.'
            exit 0
          fi
          git commit -m 'ISA V10.7.1 — compatibilidade com novo voucher'
          git push
