name: Deploy ISA V10.6.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v10-6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live V10.6.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Cloud V10.6.1','Cloud V10.6.2').replace('v10.6.1','v10.6.2')
          s=s.replace('onclick="loginLocal()"','onclick="window.loginLocal()"')
          s=s.replace('onclick="registerLocal()"','onclick="window.registerLocal()"')
          s=s.replace('onclick="resetCloudPassword()"','onclick="window.resetCloudPassword()"')
          tag='<script src="auth-v1062.js?v=1062"></script>'
          if tag not in s: s=s.replace('</head>',tag+'\n</head>')
          p.write_text(s,encoding='utf-8')

          p=Path('contrato.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Indômito Contract Manager — V10.6.1','Indômito Contract Manager — V10.6.2')
          s=s.replace("contractVersion:'10.6.1'","contractVersion:'10.6.2'")
          p.write_text(s,encoding='utf-8')

          p=Path('assinatura.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("p.contractVersion||'10.6.1'","p.contractVersion||'10.6.2'")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate V10.6.2 JavaScript
        shell: bash
        run: |
          set -e
          node --check auth-v1062.js
          node --check isa-v1061.js
          node --check contrato-v1061.js
          node --check assinatura-v1061.js
          grep -q 'auth-v1062.js?v=1062' index.html
          grep -q 'onclick="window.loginLocal()"' index.html
          grep -q 'Cloud V10.6.2' index.html
          grep -q 'Contract Manager — V10.6.2' contrato.html

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html contrato.html assinatura.html
          if git diff --cached --quiet; then
            echo 'V10.6.2 already deployed.'
            exit 0
          fi
          git commit -m 'ISA V10.6.2 — correção robusta de login'
          git push
