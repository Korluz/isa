name: Deploy ISA V11.0.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v10-6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live V11.0.8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Cloud V11.0.7','Cloud V11.0.8').replace('v11.0.7','v11.0.8')
          tag='<script src="transfer-commission-v1108.js?v=1108"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos < 0: raise SystemExit('BODY real do ISA não encontrado')
              s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')

          vp=Path('VERSION.json')
          data=json.loads(vp.read_text(encoding='utf-8'))
          data.update({
            'version':'11.0.8',
            'release':'Comissão automática de 5% nos transfers',
            'basedOn':'11.0.7',
            'databaseMigrationRequired':False,
            'features':[
              'TRANSFER IN e TRANSFER OUT passam a calcular comissão automaticamente',
              'Comissão dos transfers corresponde a 5% do valor do próprio serviço',
              'Regra vale para transfers importados do voucher e lançados manualmente',
              'Transfers cancelados permanecem no histórico mas não geram comissão',
              'Auditoria, PDF e Excel passam a refletir a nova comissão automaticamente'
            ]
          })
          data.pop('databaseMigration',None)
          data.pop('databaseMigrations',None)
          vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate V11.0.8 browser JavaScript
        shell: bash
        run: |
          set -e
          node --check auth-v1062.js
          node --check isa-v1061.js
          node --check admin-v1070.js
          node --check update-v1070.js
          node --check portal-v1100.js
          node --check viagem-v1100.js
          node --check pdf-hotfix-v1101.js
          node --check excel-v1102.js
          node --check fixes-v1103.js
          node --check contrato-flow-v1103.js
          node --check report-v1104.js
          node --check release-notes-v1104.js
          node --check transfers-v1105.js
          node --check audit-cancel-v1106.js
          node --check transfer-commission-v1108.js
          node --check contrato-v1061.js
          node --check assinatura-v1061.js
          node --check _patches/voucher-v1071.js
          node --check _patches/voucher-v1107.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for html_name in ('index.html','viagem.html','contrato.html'):
              html=Path(html_name).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',html,re.I|re.S)
              for i,code in enumerate(blocks):
                  f=Path(f'/tmp/{html_name}-{i}.js')
                  f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(f'Falha em {html_name}, script inline #{i}:')
                      print(r.stderr)
                      raise SystemExit(1)
              print(f'{html_name}: {len(blocks)} script(s) inline validado(s).')
          PY
          grep -q 'Cloud V11.0.8' index.html
          test "$(grep -o 'transfer-commission-v1108.js?v=1108' index.html | wc -l)" -eq 1
          grep -q '5% do valor' transfer-commission-v1108.js
          grep -q '"version": "11.0.8"' VERSION.json

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add index.html VERSION.json
          if git diff --cached --quiet; then
            echo 'V11.0.8 already deployed.'
            exit 0
          fi
          git commit -m 'ISA V11.0.8 — comissão automática de transfers'
          git push
