name: Deploy ISA V11.0.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v10-6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live V11.0.3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Cloud V11.0.2','Cloud V11.0.3').replace('v11.0.2','v11.0.3')
          tag='<script src="fixes-v1103.js?v=1103"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos < 0: raise SystemExit('BODY real do ISA não encontrado')
              s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')

          cp=Path('contrato.html')
          cs=cp.read_text(encoding='utf-8')
          cs=cs.replace('<title>Indômito Contract Manager — V10.6.3</title>','<title>Indômito Contract Manager — V11.0.3</title>')
          ctag='<script src="contrato-flow-v1103.js?v=1103"></script>'
          if ctag not in cs:
              pos=cs.rfind('</body>')
              if pos < 0: raise SystemExit('BODY real do contrato não encontrado')
              cs=cs[:pos]+ctag+'\n'+cs[pos:]
          cp.write_text(cs,encoding='utf-8')

          vp=Path('VERSION.json')
          data=json.loads(vp.read_text(encoding='utf-8'))
          data.update({
            'version':'11.0.3',
            'release':'Fluxo de contrato e validador operacional',
            'basedOn':'11.0.2',
            'databaseMigrationRequired':True,
            'databaseMigrations':['isa_v11_0_3_delete_signature_record'],
            'features':[
              'Exclusão protegida de registros de assinatura criados para teste ou por engano',
              'Validador aceita CHD omitido quando a quantidade esperada é zero',
              'Validador reconhece contagens no formato (ADT): 2 e equivalentes',
              'Comparação de coleta considera tanto nome do hotel quanto endereço',
              'Fluxo remoto não gera PDF antes da assinatura',
              'PDF final é gerado somente ao abrir o contrato assinado'
            ]
          })
          data.pop('databaseMigration',None)
          vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate V11.0.3 browser JavaScript
        shell: bash
        run: |
          set -e
          node --check auth-v1062.js
          node --check isa-v1061.js
          node --check admin-v1070.js
          node --check update-v1070.js
          node --check portal-v1100.js
          node --check viagem-v1100.js
          node --check pdf-hotfix-v1101.js
          node --check excel-v1102.js
          node --check fixes-v1103.js
          node --check contrato-flow-v1103.js
          node --check contrato-v1061.js
          node --check assinatura-v1061.js
          node --check _patches/voucher-v1071.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for html_name in ('index.html','viagem.html','contrato.html'):
              html=Path(html_name).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',html,re.I|re.S)
              for i,code in enumerate(blocks):
                  f=Path(f'/tmp/{html_name}-{i}.js')
                  f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(f'Falha em {html_name}, script inline #{i}:')
                      print(r.stderr)
                      raise SystemExit(1)
              print(f'{html_name}: {len(blocks)} script(s) inline validado(s).')
          PY
          grep -q 'Cloud V11.0.3' index.html
          test "$(grep -o 'fixes-v1103.js?v=1103' index.html | wc -l)" -eq 1
          test "$(grep -o 'contrato-flow-v1103.js?v=1103' contrato.html | wc -l)" -eq 1
          grep -q 'Gerar contrato PDF' contrato.html
          grep -q '"version": "11.0.3"' VERSION.json

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html contrato.html VERSION.json
          if git diff --cached --quiet; then
            echo 'V11.0.3 already deployed.'
            exit 0
          fi
          git commit -m 'ISA V11.0.3 — contrato remoto e validador operacional'
          git push
