name: Deploy ISA V10.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v10-6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live V10.7.0
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Cloud V10.6.3','Cloud V10.7.0').replace('v10.6.3','v10.7.0')

          css='<link rel="stylesheet" href="mobile-v1070.css?v=1070">'
          if css not in s:
              pos=s.find('</head>')
              if pos<0: raise SystemExit('HEAD real não encontrado')
              s=s[:pos]+css+'\n'+s[pos:]

          scripts=['<script src="admin-v1070.js?v=1070"></script>','<script src="update-v1070.js?v=1070"></script>']
          for tag in scripts:
              if tag not in s:
                  pos=s.rfind('</body>')
                  if pos<0: raise SystemExit('BODY real não encontrado')
                  s=s[:pos]+tag+'\n'+s[pos:]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate V10.7.0 browser JavaScript
        shell: bash
        run: |
          set -e
          node --check auth-v1062.js
          node --check isa-v1061.js
          node --check admin-v1070.js
          node --check update-v1070.js
          node --check contrato-v1061.js
          node --check assinatura-v1061.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',html,re.I|re.S)
          if not blocks: raise SystemExit('Nenhum script inline encontrado')
          for i,code in enumerate(blocks):
              f=Path(f'/tmp/isa-inline-{i}.js');f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(f'Falha no script inline #{i}:');print(r.stderr);raise SystemExit(1)
          print(f'{len(blocks)} scripts inline validados.')
          PY
          grep -q 'Cloud V10.7.0' index.html
          test "$(grep -o 'mobile-v1070.css?v=1070' index.html | wc -l)" -eq 1
          test "$(grep -o 'admin-v1070.js?v=1070' index.html | wc -l)" -eq 1
          test "$(grep -o 'update-v1070.js?v=1070' index.html | wc -l)" -eq 1
          grep -q '"version": "10.7.0"' VERSION.json

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'V10.7.0 already deployed.'
            exit 0
          fi
          git commit -m 'ISA V10.7.0 — contas, atualização automática e menu mobile'
          git push
