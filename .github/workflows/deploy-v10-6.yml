name: Deploy ISA V11.0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v10-6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live V11.0.7
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Cloud V11.0.6','Cloud V11.0.7').replace('v11.0.6','v11.0.7')

          start=s.find('function parseVoucherNovo(raw){')
          end=s.find('function parseVoucher(raw){',start)
          if start < 0 or end < 0:
              raise SystemExit('Parser de voucher novo não encontrado no index.html')
          parser=Path('_patches/voucher-v1107.js').read_text(encoding='utf-8').strip()
          s=s[:start]+parser+'\n '+s[end:]
          p.write_text(s,encoding='utf-8')

          vp=Path('VERSION.json')
          data=json.loads(vp.read_text(encoding='utf-8'))
          data.update({
            'version':'11.0.7',
            'release':'Leitor robusto para vouchers com serviços em múltiplas linhas',
            'basedOn':'11.0.6',
            'databaseMigrationRequired':False,
            'features':[
              'Leitor de voucher passa a montar os serviços pelos blocos individuais do PDF',
              'Reconhece nomes de passeios quebrados em múltiplas linhas',
              'TRANSFER IN e TRANSFER OUT passam a ser reconhecidos mesmo com dados de aeroporto e voo na mesma linha',
              'Ponto de encontro passa a aproveitar hotel e endereço completos dos vouchers individuais',
              'Compatibilidade com o parser anterior é mantida como fallback'
            ]
          })
          data.pop('databaseMigration',None)
          data.pop('databaseMigrations',None)
          vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate V11.0.7 browser JavaScript
        shell: bash
        run: |
          set -e
          node --check auth-v1062.js
          node --check isa-v1061.js
          node --check admin-v1070.js
          node --check update-v1070.js
          node --check portal-v1100.js
          node --check viagem-v1100.js
          node --check pdf-hotfix-v1101.js
          node --check excel-v1102.js
          node --check fixes-v1103.js
          node --check contrato-flow-v1103.js
          node --check report-v1104.js
          node --check release-notes-v1104.js
          node --check transfers-v1105.js
          node --check audit-cancel-v1106.js
          node --check contrato-v1061.js
          node --check assinatura-v1061.js
          node --check _patches/voucher-v1071.js
          node --check _patches/voucher-v1107.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for html_name in ('index.html','viagem.html','contrato.html'):
              html=Path(html_name).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',html,re.I|re.S)
              for i,code in enumerate(blocks):
                  f=Path(f'/tmp/{html_name}-{i}.js')
                  f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(f'Falha em {html_name}, script inline #{i}:')
                      print(r.stderr)
                      raise SystemExit(1)
              print(f'{html_name}: {len(blocks)} script(s) inline validado(s).')
          PY
          grep -q 'Cloud V11.0.7' index.html
          grep -q 'canonicalServiceName' index.html
          grep -q 'detailStarts' index.html
          grep -q 'TRANSFER IN' _patches/voucher-v1107.js
          grep -q 'TRANSFER OUT' _patches/voucher-v1107.js
          grep -q '"version": "11.0.7"' VERSION.json

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add index.html VERSION.json
          if git diff --cached --quiet; then
            echo 'V11.0.7 already deployed.'
            exit 0
          fi
          git commit -m 'ISA V11.0.7 — leitor robusto de voucher'
          git push
