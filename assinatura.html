<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Assinar contrato — Indômito</title>
<style>
:root{--navy:#0b2136;--gold:#dfa82f;--bg:#f3f6fa;--text:#152235;--muted:#677483;--line:#dce3ea;--ok:#15803d;--danger:#b91c1c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071522,#173550 340px,var(--bg) 340px);font-family:Inter,Arial,sans-serif;color:var(--text)}.wrap{max-width:780px;margin:auto;padding:18px}.head{color:#fff;padding:22px 2px 18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;background:var(--gold);display:grid;place-items:center;color:var(--navy);font-weight:900}.head h1{margin:0;font-size:22px}.head p{margin:5px 0 0;color:#c8d4df}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(0,0,0,.08)}h2{font-size:18px;margin:0 0 12px}.meta{color:var(--muted);font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#f7f9fb;border-radius:10px;padding:10px}.box small{display:block;color:var(--muted)}.box strong{display:block;margin-top:3px}.tour{border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:8px}.ticket{background:#fff7df;border-color:#f1c85a}.chip{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:999px;background:#fff0b8;color:#795500;font-size:10px;font-weight:900}.legal{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafafa;font-family:Georgia,serif;font-size:13px;line-height:1.55}.legal h3{font-size:14px;margin:17px 0 7px}.legal h3:first-child{margin-top:0}.legal p{margin:5px 0}label.accept{display:flex;gap:9px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px;line-height:1.4;font-size:13px}label.accept input{margin-top:2px;transform:scale(1.15)}input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.sig{width:100%;height:190px;border:2px dashed #9aa7b4;border-radius:12px;background:#fff;touch-action:none;display:block;margin-top:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:11px;padding:12px 15px;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:var(--navy);flex:1}.secondary{background:#e9eef4;color:var(--navy)}.status{padding:13px;border-radius:12px;background:#eef5ff;color:#244f7d;line-height:1.45}.status.ok{background:#ecfdf3;color:#166534}.status.bad{background:#fff1f2;color:#9f1239}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="head"><div class="brand"><div class="logo">ISA</div><div><h1>Assinatura eletrônica</h1><p>Turismo e Transporte Indômito Ltda</p></div></div></div><div id="main"><div class="card"><div class="status">Carregando contrato...</div></div></div></div>
<script>
const SUPABASE_URL='https://cajrgongdxhzfudbheiv.supabase.co',SUPABASE_KEY='sb_publishable_6ydTiQ192A9XfGzIAUtIrw_R7zBbq7h';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});let request=null,token=new URLSearchParams(location.search).get('t')||'',hasInk=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>{const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):String(v||'—')};const dateBR=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(v||'—')};
function maskCPF(v){const d=String(v||'').replace(/\D/g,'');return d.length===11?`***.${d.slice(3,6)}.${d.slice(6,9)}-**`:'CPF cadastrado'}
function render(data){request=data;const p=data.payload||{},tours=Array.isArray(p.tours)?p.tours:[],ticket=tours.some(t=>t.ticketNonRefundable);if(data.status==='signed')return renderSigned(data);document.getElementById('main').innerHTML=`<div class="card"><h2>Contrato de Prestação de Serviços</h2><div class="meta">Versão ${esc(p.contractVersion||'10.6.0')} • Protocolo ${esc(data.id)}</div><div class="grid" style="margin-top:12px"><div class="box"><small>Contratante</small><strong>${esc(p.nome)}</strong></div><div class="box"><small>CPF</small><strong>${esc(maskCPF(p.cpf))}</strong></div><div class="box"><small>Valor total</small><strong>${esc(p.valor||'—')}</strong></div><div class="box"><small>Pagamento</small><strong>${esc(p.pagamento||'—')}</strong></div></div></div><div class="card"><h2>Serviços contratados</h2>${tours.length?tours.map(t=>`<div class="tour ${t.ticketNonRefundable?'ticket':''}"><strong>${esc(t.name)}</strong> • ${esc(dateBR(t.date))}${t.price?`<div class="meta">Valor registrado: ${money(t.price)}</div>`:''}${t.ticketNonRefundable?'<span class="chip">TICKET/RESERVA NÃO REEMBOLSÁVEL APÓS EMISSÃO</span>':''}</div>`).join(''):'<div class="meta">Os serviços constam no voucher da reserva.</div>'}</div><div class="card"><h2>Contrato completo</h2><div class="legal">${(p.legalIntro||[]).map(x=>`<p>${esc(x)}</p>`).join('')}${(p.legalSections||[]).map(([h,ps])=>`<h3>${esc(h)}</h3>${(ps||[]).map(x=>`<p>${esc(x)}</p>`).join('')}`).join('')}${(p.legalClosing||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</div><label class="accept"><input type="checkbox" id="acceptGeneral"><span>Li integralmente o contrato acima, tive oportunidade de revisar suas condições e concordo com a contratação e com a assinatura eletrônica deste instrumento.</span></label>${ticket?`<label class="accept"><input type="checkbox" id="acceptTicket"><span>Estou ciente de que os passeios identificados como “TICKET/RESERVA NÃO REEMBOLSÁVEL APÓS EMISSÃO” possuem componente adquirido antecipadamente de terceiro e sujeito às condições específicas de cancelamento descritas no contrato.</span></label>`:''}</div><div class="card"><h2>Confirmar identidade e assinar</h2><div class="meta">Digite o CPF do contratante para confirmar e assine no quadro usando o dedo.</div><div style="margin-top:10px"><input type="text" id="cpfConfirm" inputmode="numeric" placeholder="CPF do contratante"></div><canvas id="sig" class="sig"></canvas><div class="actions"><button class="secondary" onclick="clearSig()">Limpar</button><button class="primary" id="signBtn" onclick="signNow()">Assinar contrato</button></div><div id="signStatus" class="meta" style="margin-top:9px"></div></div>`;setupSig()}
function renderSigned(d){document.getElementById('main').innerHTML=`<div class="card"><div class="status ok"><strong>✓ Contrato já assinado</strong><br>Assinatura registrada em ${new Date(d.signed_at).toLocaleString('pt-BR')}.<br>Protocolo: ${esc(d.id)}.</div></div><div class="card"><h2>${esc(d.payload?.nome||'Contratante')}</h2><div class="meta">O registro eletrônico foi concluído. Guarde este protocolo.</div></div>`}
function setupSig(){const c=document.getElementById('sig'),ctx=c.getContext('2d');let draw=false,last=null;const resize=()=>{const r=Math.max(devicePixelRatio||1,1),b=c.getBoundingClientRect();c.width=b.width*r;c.height=b.height*r;ctx.setTransform(r,0,0,r,0,0);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#111'};resize();const p=e=>{const b=c.getBoundingClientRect(),x=e.touches?.[0]||e;return{x:x.clientX-b.left,y:x.clientY-b.top}};const st=e=>{e.preventDefault();draw=true;last=p(e)};const mv=e=>{if(!draw)return;e.preventDefault();const q=p(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;hasInk=true};const en=e=>{if(draw){e.preventDefault();draw=false}};c.addEventListener('pointerdown',st);c.addEventListener('pointermove',mv);window.addEventListener('pointerup',en);c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en,{passive:false})}
window.clearSig=()=>{const c=document.getElementById('sig');if(c){c.getContext('2d').clearRect(0,0,c.width,c.height);hasInk=false}};
async function signNow(){const st=document.getElementById('signStatus'),btn=document.getElementById('signBtn'),general=document.getElementById('acceptGeneral')?.checked,ticketNeeded=(request.payload?.tours||[]).some(t=>t.ticketNonRefundable),ticketOk=!ticketNeeded||document.getElementById('acceptTicket')?.checked,cpf=document.getElementById('cpfConfirm').value;if(!general)return st.textContent='Marque o aceite do contrato.';if(!ticketOk)return st.textContent='Confirme também a ciência sobre tickets.';if(!hasInk)return st.textContent='Faça sua assinatura no quadro.';if(!cpf.trim())return st.textContent='Digite o CPF para confirmar sua identidade.';btn.disabled=true;st.textContent='Registrando assinatura...';const sig=document.getElementById('sig').toDataURL('image/png');const{data,error}=await sb.rpc('sign_contract_signature_request',{p_token:token,p_signer_name:request.payload?.nome||'',p_signer_cpf:cpf,p_signature_data:sig,p_accept_terms:true,p_accept_ticket_terms:!!ticketOk,p_user_agent:navigator.userAgent});if(error){btn.disabled=false;st.textContent=error.message;return}const row=Array.isArray(data)?data[0]:data;renderSigned({...request,status:'signed',signed_at:row?.signed_at||new Date().toISOString()})}
(async()=>{if(!token){document.getElementById('main').innerHTML='<div class="card"><div class="status bad">Link de assinatura inválido.</div></div>';return}const{data,error}=await sb.rpc('get_contract_signature_request',{p_token:token});if(error||!data){document.getElementById('main').innerHTML=`<div class="card"><div class="status bad">${esc(error?.message||'Contrato não encontrado, expirado ou link inválido.')}</div></div>`;return}render(Array.isArray(data)?data[0]:data)})();
</script></body></html>
